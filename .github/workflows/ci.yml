name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (composite)
        with:
          toolchain: "1.99.0"
          components: clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy (deny warnings on the library crates)
        run: cargo clippy -p scanweave-core -p scanweave-io -p scanweave-cli -- -D warnings

  publication-hygiene:
    name: Publication hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README and LICENSE exist
        run: |
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE-MIT || test -f LICENSE-APACHE || { echo "no license file"; exit 1; }
      - name: No macOS junk or stray archives tracked
        run: |
          ! git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)\._' && echo "clean" || { echo "junk files tracked"; exit 1; }
      - name: Repository metadata is not the placeholder
        run: |
          ! grep -q 'example.invalid' Cargo.toml || { echo "placeholder repository URL in Cargo.toml"; exit 1; }

  qualification:
    name: Qualification gates (python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: System tools
        # qpdf is git-ignored (tools/ is a developer-local build); install the
        # distro package — qualification/tools_env.py prefers tools/dist when
        # present and falls back to PATH (or SCANWEAVE_QPDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
      - name: Python deps
        run: |
          python -m venv qualification/.venv
          qualification/.venv/bin/pip install -q pypdfium2 numpy Pillow fontTools jsonschema lxml==6.1.3
      - name: Build the OpenType sanitizer (OTS)
        # tools/ (developer-local builds) is git-ignored; build the same OTS 9.3.0
        # from source and point the harness at it via SCANWEAVE_OTS
        run: |
          python -m pip install -q meson ninja
          git clone --depth 1 --branch v9.3.0 https://github.com/khaledhosny/ots.git /tmp/ots
          meson setup /tmp/ots/build /tmp/ots > /dev/null
          ninja -C /tmp/ots/build
          /tmp/ots/build/ots-sanitize --version
          echo "SCANWEAVE_OTS=/tmp/ots/build/ots-sanitize" >> "$GITHUB_ENV"
      - name: Build the probe / CLI
        run: cargo build --workspace
      - name: Sub-pixel metric analytical tests
        run: qualification/.venv/bin/python qualification/test_subpixel_metric.py
      - name: Corpus adapter
        run: qualification/.venv/bin/python qualification/test_corpus_adapter.py
      - name: Fixture schema layer
        # must run with the venv interpreter: jsonschema is not a system package
        run: qualification/.venv/bin/python qualification/validate_fixtures.py
      - name: hOCR XML entity boundary
        run: qualification/.venv/bin/python qualification/test_hocr_xml_security.py
      - name: Text search gates
        run: qualification/.venv/bin/python qualification/test_text_search.py
      - name: Instrument correctness tests (M1-C-R3)
        env:
          M1CR3_REPORT: work/m1c_r3/diag4/diagnostic_full.json
        run: |
          qualification/.venv/bin/python qualification/experiments/m1c_r3/test_translation.py
          qualification/.venv/bin/python qualification/experiments/m1c_r3/generator.py
          qualification/.venv/bin/python qualification/experiments/m1c_r3/test_diagnostic_modes.py
      - name: Paint fidelity + M1A-05 regression
        run: qualification/.venv/bin/python qualification/test_m1b_paint_fidelity.py
      - name: Document-level search
        run: qualification/.venv/bin/python qualification/test_m1b_document_search.py
