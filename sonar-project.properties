sonar.projectKey=mitchins_scanweave
sonar.organization=mitchins
sonar.host.url=https://sonarcloud.io
sonar.sources=crates,probes,qualification,.github
sonar.tests=crates,probes,qualification
sonar.inclusions=**/*.rs,**/*.c,**/*.h,**/*.py,**/*.sh,**/*.yml,**/*.yaml
sonar.test.inclusions=**/tests/**/*.rs,**/test_*.py,**/*_tests.rs,**/contour_tests.rs
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/target/**,**/vendor/**,**/node_modules/**
sonar.sourceEncoding=UTF-8
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
