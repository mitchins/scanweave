# m1b-operating — M1-B fidelity policy (machine-readable)
# Companion notes: m1b-operating-notes.md (evidence and rationale).

schema = "scanweave-policy"
revision = "m1b-operating"
recorded = "2026-10-15"
supersedes = "none"
status = "development calibration (not a holdout evaluation)"

# The SPEC's §4.2 acceptance policy, unchanged. The converter defaults to this
# and ENFORCES it: a vector unit whose traced outline reproduces the source ink
# mask below this threshold is not vectorized (its region degrades to raster).
[acceptance]
min_ink_iou = 0.98

# The floor the M1-B document/baseline harnesses request explicitly when they
# want the reconstruction to measure (the harness then applies its own
# render-based gates). Documented as an explicit operator decision, not a
# silent change of the shipped default.
[measurement]
min_ink_iou = 0.75

# The render-based gates the qualification harness applies to rendered output
# (two independent engines). These are NOT relaxed by this revision.
[harness]
min_iou = 0.98
max_edge_p95_px = 0.5
max_edge_max_px = 1.0
max_mae = 0.02

[fallback]
# regions degrade to raster when their outline falls below the measurement
# threshold; the emitted output therefore contains no vector unit below it.
reason = "FidelityBelowPolicy"
